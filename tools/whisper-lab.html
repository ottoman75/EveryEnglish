<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>폰 안 받아쓰기 시험</title>
<style>
:root { --bg:#14122a; --fg:#eee; --card:#221f45; --accent:#ff7a8a; }
body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system,system-ui,sans-serif; }
h1 { font-size:18px; margin:0 0 4px; } p { margin:4px 0 12px; color:#bbb; font-size:13px; }
button { display:block; width:100%; margin:8px 0; padding:16px; border:0; border-radius:12px; background:var(--card); color:var(--fg); font-size:16px; }
button:disabled { opacity:.45; } #rec.on { background:var(--accent); color:#111; font-weight:700; }
#copy { background:#444; }
.meter { height:8px; border-radius:4px; background:#333; overflow:hidden; } .meter i { display:block; height:100%; width:0; background:#9f9; }
pre { white-space:pre-wrap; background:#000; color:#9f9; padding:10px; border-radius:10px; font:12px/1.4 ui-monospace,monospace; min-height:120px; }
</style></head><body>
<h1>🎙️ 폰 안 받아쓰기(Whisper) 시험</h1>
<p>① '모델 받기'(처음 한 번 약 40MB, 와이파이 권장) → ② '말하기'를 눌러 영어 문장을 말하고, 말이 끝나면 자동으로 받아씁니다. <b>5번 이상</b> 연속으로 해 보고 '기록 복사'로 붙여넣어 주세요.</p>
<button id="load">① 모델 받기</button>
<button id="rec" disabled>② 말하기</button>
<div class="meter"><i id="lv"></i></div>
<button id="copy">📋 기록 복사</button>
<pre id="log"></pre>
<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";
const out = document.getElementById("log"), lines = [];
const L = (s) => { lines.push((performance.now() / 1000).toFixed(1) + "s " + s); out.textContent = lines.join("\n"); };
L(navigator.userAgent.replace(/^Mozilla\/5.0 /, ""));
env.allowLocalModels = false;
let asr = null;
const MODEL = "onnx-community/whisper-tiny.en";

async function load() {
  const t0 = performance.now(); let lastPct = -10;
  asr = await pipeline("automatic-speech-recognition", MODEL, {
    dtype: "q8", device: "wasm",
    progress_callback: (p) => {
      if (p.status === "progress" && p.total > 5e6) {
        const pct = Math.floor(p.progress);
        if (pct >= lastPct + 20) { lastPct = pct; L("  받는 중 " + p.file.split("/").pop() + " " + pct + "%"); }
      }
    }
  });
  L("모델 준비 " + ((performance.now() - t0) / 1000).toFixed(1) + "초");
}
async function transcribe(f32, tag) {
  const t0 = performance.now();
  const r = await asr(f32);
  L(tag + " 결과: \"" + r.text.trim() + "\" (받아쓰기 " + Math.round(performance.now() - t0) + "ms, 소리 " + (f32.length / 16000).toFixed(1) + "초)");
  return r.text.trim();
}

// 16kHz 모노로 바꾸기
async function to16k(chunks, rate) {
  const n = chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(n);
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  if (rate === 16000) return all;
  const off = new OfflineAudioContext(1, Math.ceil(n * 16000 / rate), 16000);
  const b = off.createBuffer(1, n, rate); b.copyToChannel(all, 0);
  const s = off.createBufferSource(); s.buffer = b; s.connect(off.destination); s.start();
  return (await off.startRendering()).getChannelData(0);
}

// 녹음: 말이 시작된 뒤 1.2초 조용하면 끝, 최대 8초. 매번 마이크를 새로 열고 닫는다
let n = 0;
function record() {
  return new Promise(async (resolve, reject) => {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { reject(e); return; }
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = []; let spoke = false, quietSince = 0, peak = 0; const t0 = performance.now();
    proc.onaudioprocess = (e) => {
      const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
      let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
      const rms = Math.sqrt(s / d.length); peak = Math.max(peak, rms);
      document.getElementById("lv").style.width = Math.min(100, rms * 600) + "%";
      const now = performance.now();
      if (rms > 0.02) { spoke = true; quietSince = 0; } else if (spoke && !quietSince) quietSince = now;
      if ((spoke && quietSince && now - quietSince > 1200) || now - t0 > 8000) finish();
    };
    let done = false;
    const finish = async () => {
      if (done) return; done = true;
      proc.disconnect(); src.disconnect(); stream.getTracks().forEach((t) => t.stop());
      document.getElementById("lv").style.width = "0";
      const rate = ctx.sampleRate; await ctx.close();
      L("  녹음 " + ((performance.now() - t0) / 1000).toFixed(1) + "초 · 최대 음량 " + peak.toFixed(3) + (spoke ? "" : " (말소리 없음)"));
      resolve(await to16k(chunks, rate));
    };
    src.connect(proc); proc.connect(ctx.destination);
  });
}

document.getElementById("load").onclick = async (e) => {
  e.target.disabled = true; L("모델 받기 시작");
  try { await load(); document.getElementById("rec").disabled = false; e.target.textContent = "✅ 모델 준비됨"; }
  catch (err) { L("모델 실패: " + err.message); e.target.disabled = false; }
};
document.getElementById("rec").onclick = async (e) => {
  const b = e.target; b.disabled = true; b.classList.add("on"); b.textContent = "🔴 듣는 중… 말해 주세요";
  n++;
  try { const f = await record(); b.textContent = "받아쓰는 중…"; await transcribe(f, "#" + n); }
  catch (err) { L("#" + n + " 오류: " + err.name + " " + err.message); }
  b.disabled = false; b.classList.remove("on"); b.textContent = "② 말하기";
};
document.getElementById("copy").onclick = () => navigator.clipboard.writeText(lines.join("\n")).then(
  () => { document.getElementById("copy").textContent = "✅ 복사됨"; }, () => L("복사 실패 — 화면 캡처해 주세요"));

// 맥 자가 점검: ?selftest — 녹음 파일 3개로 받아쓰기
if (/selftest/.test(location.search)) {
  (async () => {
    await import("../js/data/audio-manifest.js").catch(() => {});
    await load();
    const texts = ["Can you make it with oat milk?", "I'd like a hot americano.", "Here's your seafood pasta and... a Greek salad."];
    for (const t of texts) {
      const clip = window.EE_AUDIO && EE_AUDIO.clips[t];
      if (!clip) { L("녹음 없음: " + t); continue; }
      const buf = await (await fetch("../" + EE_AUDIO.base + clip)).arrayBuffer();
      const ab = await new AudioContext().decodeAudioData(buf);
      await transcribe(await to16k([ab.getChannelData(0)], ab.sampleRate), "정답 \"" + t + "\" →");
    }
    document.title = "done";
  })().catch((e) => { L("selftest 실패: " + e.message); document.title = "done"; });
}
</script>
</body></html>
