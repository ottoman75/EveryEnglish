name: EveryEnglish
options:
  bundleIdPrefix: kr.co.ottocraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: GS7MKDFWW3
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EveryEnglish:
    type: application
    platform: iOS
    sources:
      - EveryEnglish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.ottocraft.EveryEnglish
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: EveryEnglish/Resources/Info.plist
      properties:
        CFBundleDisplayName: EveryEnglish
        CFBundleDevelopmentRegion: ko
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: []
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 영어로 말한 답을 듣고 채점하기 위해 마이크를 사용합니다.
        NSSpeechRecognitionUsageDescription: 영어로 말한 답을 글자로 바꿔 채점하기 위해 음성 인식을 사용합니다.
        EEWebAppURL: https://ottoman75.github.io/EveryEnglish/
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  EveryEnglishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EveryEnglishTests
    dependencies:
      - target: EveryEnglish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.ottocraft.EveryEnglishTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EveryEnglish:
    build:
      targets:
        EveryEnglish: all
    test:
      targets:
        - EveryEnglishTests
