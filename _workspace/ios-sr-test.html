<!doctype html><meta charset="utf-8"><title>iOS speech recognition test</title><pre id="out">running</pre>
<script>
// 아이폰 사파리 흉내(엄격): 마이크는 한 인식기만 쓸 수 있다. 결과 뒤 onend 없음. abort()로는 마이크가 안 풀림.
// stop()을 해야 0.4초 뒤 onend와 함께 풀린다. 마이크를 다른 인식기가 쥐고 있으면 start()는 조용히 실패.
var micOwner = null, starts = 0, created = 0, stops = 0, aborts = 0;
function FakeRec() { created++; this._running = false; }
FakeRec.prototype.start = function () {
  starts++; var self = this;
  if (this._running) { var e = new Error("already started"); e.name = "InvalidStateError"; throw e; }
  if (micOwner && micOwner !== this) return;            // 마이크 사용 중 → 아무 일도 안 일어남
  micOwner = this; this._running = true; var n = starts;
  setTimeout(function () { self.onstart && self.onstart(); }, 30);
  setTimeout(function () {
    if (!self._running || !self.onresult) return;
    self.onresult({ resultIndex: 0, results: [{ 0: { transcript: "answer " + n }, isFinal: true, length: 1 }] });
  }, 300);
};
FakeRec.prototype.stop = function () {
  stops++; var self = this;
  if (!this._running) return;
  setTimeout(function () { self._running = false; if (micOwner === self) micOwner = null; self.onend && self.onend(); }, 400);
};
FakeRec.prototype.abort = function () { aborts++; /* 아이폰: 마이크를 놓지 않는다 */ };
window.webkitSpeechRecognition = FakeRec; window.SpeechRecognition = FakeRec;
</script>
<script src="../js/core/speech.js"></script>
<script>
(async function () {
  var res = [];
  for (var i = 0; i < 3; i++) {
    var t0 = performance.now();
    var s = EESpeech.listen();
    var txt = await Promise.race([s.promise, new Promise(function (r) { setTimeout(function () { r("TIMEOUT"); }, 4000); })]);
    res.push(txt + "(" + Math.round(performance.now() - t0) + "ms)");
  }
  await new Promise(function (r) { setTimeout(r, 800); });
  document.getElementById("out").textContent = JSON.stringify({ results: res, recognizersCreated: created, starts: starts, stops: stops, aborts: aborts, micReleased: micOwner === null });
  document.title = "done";
})();
</script>
